<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDS CAS 번호 조회 및 GHS 라벨 출력기 (SLP-DL410 맞춤)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* GHS 마름모꼴 심볼 스타일 */
        .ghs-diamond {
            width: 40px;
            height: 40px;
            border: 2.5px solid #dc2626;
            transform: rotate(45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            margin: 6px 10px;
        }
        .ghs-diamond i {
            transform: rotate(-45deg);
            font-size: 18px;
            color: #1e293b;
        }

        /* SLP-DL410 라벨 프린터 최적화 인쇄 설정 (인쇄폭 108mm 기준) */
        @media print {
            @page {
                size: 100mm 150mm;
                margin: 2mm;
            }
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 96mm !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                font-size: 11px !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md no-print">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white/10 p-2.5 rounded-xl">
                    <i class="fa-solid fa-flask-vial text-2xl text-indigo-200"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">MSDS 및 GHS 경고표지 라벨 발행기</h1>
                    <p class="text-xs text-indigo-200">SLP-DL410 라벨 프린터 전용 최적화 레이아웃</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openApiSettings()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3.5 py-2 rounded-lg font-medium transition flex items-center gap-1.5 shadow-sm border border-indigo-500">
                    <i class="fa-solid fa-key"></i> API 설정
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
        
        <!-- 검색 섹션 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 no-print">
            <label for="searchInput" class="block text-sm font-semibold text-slate-700 mb-2">화학물질명 또는 CAS 번호 검색</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-grow">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="searchInput" onkeydown="if(event.key==='Enter') searchChemical()" placeholder="예: 아세톤, 67-64-1, 염산, 7647-01-0" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>
                <button onclick="searchChemical()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-medium text-sm transition flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-solid fa-search"></i> 검색
                </button>
            </div>
            <!-- 빠른 추천 검색어 -->
            <div class="mt-3 flex flex-wrap items-center gap-2">
                <span class="text-xs text-slate-500 font-medium">추천 검색어:</span>
                <button onclick="quickSearch('아세톤')" class="text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-slate-600 px-2.5 py-1 rounded-md transition">아세톤 (67-64-1)</button>
                <button onclick="quickSearch('벤젠')" class="text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-slate-600 px-2.5 py-1 rounded-md transition">벤젠 (71-43-2)</button>
                <button onclick="quickSearch('염산')" class="text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-slate-600 px-2.5 py-1 rounded-md transition">염산 (7647-01-0)</button>
                <button onclick="quickSearch('염산 구아니딘')" class="text-xs bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 text-slate-600 px-2.5 py-1 rounded-md transition">염산 구아니딘</button>
            </div>
            <div id="apiStatusMsg" class="mt-2 text-xs text-slate-400 flex items-center gap-1">
                <i class="fa-solid fa-circle-info text-indigo-500"></i> 안전보건공단 API 및 CAS 번호 정밀 검색 기능이 적용되어 있습니다.
            </div>
        </div>

        <!-- 결과 영역 -->
        <div id="resultContainer" class="grid grid-cols-1 gap-6">
            <div class="bg-white p-12 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-400">
                <i class="fa-solid fa-flask text-4xl mb-3 text-slate-300"></i>
                <p class="text-sm font-medium">조회할 화학물질명 또는 CAS 번호를 입력해주세요.</p>
            </div>
        </div>

    </main>

    <!-- API 설정 모달 -->
    <div id="apiModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-key text-indigo-600"></i> 안전보건공단 API 설정
                </h3>
                <button onclick="closeApiSettings()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-600 leading-relaxed">공공데이터포털에서 발급받은 일반인증키를 입력하세요. 입력된 키는 브라우저에 안전하게 저장됩니다.</p>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">API 인증키 (ServiceKey)</label>
                <input type="text" id="apiKeyInput" placeholder="인증키 입력" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeApiSettings()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-medium transition">취소</button>
                <button onclick="saveApiKey()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-medium transition">저장 및 적용</button>
            </div>
        </div>
    </div>

    <!-- Script Application -->
    <script>
        let userApiKey = localStorage.getItem('msds_api_key') || '';
        if(userApiKey) {
            document.getElementById('apiKeyInput').value = userApiKey;
            document.getElementById('apiStatusMsg').innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i> 안전보건공단 API 연동 모드가 활성화되어 있습니다.`;
        }

        const mockChemicalDatabase = [
            {
                chemName: "아세톤",
                engName: "Acetone",
                casNo: "67-64-1",
                unNo: "1090",
                signalWord: "위험 (Danger)",
                hazardClass: "인화성 액체 (구분 2), 눈 심한 자극 (구분 2)",
                hazardStatements: "H225: 고인화성 액체 및 증기\nH319: 눈에 심한 자극을 일으킴",
                precautionaryStatements: "P210: 열·스파크·화염으로부터 멀리하시오\nP280: 보호장갑·보호의·보안경 착용",
                firstAid: { inhalation: "신선한 공기로 이동", skin: "비누와 물로 씻기", eyes: "물로 수 분간 씻기", ingestion: "즉시 의사의 진찰 받기" },
                fireFighting: "분말소화약제, 이산화탄소 사용",
                storage: "환기가 잘 되는 곳에 보관"
            },
            {
                chemName: "벤젠",
                engName: "Benzene",
                casNo: "71-43-2",
                unNo: "1114",
                signalWord: "위험 (Danger)",
                hazardClass: "인화성 액체, 급성독성, 발암성",
                hazardStatements: "H225: 고인화성 액체 및 증기\nH350: 암을 일으킬 수 있음",
                precautionaryStatements: "P210: 열·스파크·화염으로부터 멀리하시오\nP280: 보호장갑·보호의·보안경 착용",
                firstAid: { inhalation: "신선한 공기로 이동", skin: "다량의 물로 씻기", eyes: "흐르는 물로 씻기", ingestion: "의사 처치 받기" },
                fireFighting: "내알코올성 포, 건조분말 사용",
                storage: "방폭형 환기 시설 저장소 보관"
            },
            {
                chemName: "염산",
                engName: "Hydrochloric Acid",
                casNo: "7647-01-0",
                unNo: "1789",
                signalWord: "위험 (Danger)",
                hazardClass: "금속부식성 물질, 피부 부식성, 심한 눈 손상성",
                hazardStatements: "H290: 금속을 부식시킬 수 있음\nH314: 피부에 심한 화상과 눈 손상을 일으킴",
                precautionaryStatements: "P234: 원래의 용기에만 보관\nP280: 보호장갑·보호의·보안경 착용",
                firstAid: { inhalation: "신선한 공기로 이동", skin: "다량의 물로 15분 이상 씻기", eyes: "흐르는 물로 15분 이상 씻기", ingestion: "토하게 하지 말고 물 마시기" },
                fireFighting: "주변 화재 시 적절한 소화제 사용",
                storage: "내산성 바닥 및 환기시설 보관"
            }
        ];

        function openApiSettings() { document.getElementById('apiModal').classList.remove('hidden'); }
        function closeApiSettings() { document.getElementById('apiModal').classList.add('hidden'); }
        function saveApiKey() {
            userApiKey = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('msds_api_key', userApiKey);
            closeApiSettings();
            if(userApiKey) {
                document.getElementById('apiStatusMsg').innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i> 안전보건공단 API 연동 모드가 활성화되었습니다.`;
                showToast("API 인증키가 브라우저에 저장되었습니다.");
            } else {
                showToast("인증키가 해제되었습니다.");
            }
        }
        function quickSearch(name) {
            document.getElementById('searchInput').value = name;
            searchChemical();
        }

        // GHS 그림문자 자동 판별 함수
        function getGhsSymbols(text) {
            if (!text) return '<span class="text-xs text-slate-400">심볼 없음</span>';
            const lower = text.toLowerCase();
            let symbolsHtml = '';

            if (lower.includes('인화성') || lower.includes('화재') || lower.includes('가연성') || lower.includes('h225')) {
                symbolsHtml += `<div class="ghs-diamond"><i class="fa-solid fa-fire"></i></div>`;
            }
            if (lower.includes('부식') || lower.includes('피부 부식성') || lower.includes('금속부식성') || lower.includes('h314') || lower.includes('h290')) {
                symbolsHtml += `<div class="ghs-diamond"><i class="fa-solid fa-vial-circle-check"></i></div>`;
            }
            if (lower.includes('급성 독성') || lower.includes('유독')) {
                symbolsHtml += `<div class="ghs-diamond"><i class="fa-solid fa-skull-crossbones"></i></div>`;
            }
            if (!symbolsHtml) {
                symbolsHtml += `<div class="ghs-diamond"><i class="fa-solid fa-exclamation"></i></div>`;
            }
            return symbolsHtml;
        }

        // CAS 번호 및 물질명 검색 함수
        async function searchChemical() {
            const rawQuery = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('resultContainer');
            
            if(!rawQuery) {
                showToast("검색할 화학물질명 또는 CAS 번호를 입력해주세요.");
                return;
            }

            container.innerHTML = `
                <div class="bg-white p-12 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-500 flex flex-col items-center justify-center gap-3">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-indigo-600"></i>
                    <p class="text-sm font-medium">안전보건공단 API 조회 및 CAS 번호 매칭 중...</p>
                </div>
            `;

            let foundData = null;
            const isCasNumber = /^\d+-\d+-\d+$/.test(rawQuery);

            // 1. API 키가 있는 경우 우선 호출 시도
            if (userApiKey) {
                try {
                    const apiUrl = `https://apis.data.go.kr/B552468/msdschem/getChemList?serviceKey=${userApiKey}&searchWrd=${encodeURIComponent(rawQuery)}&searchCnd=0&numOfRows=10&pageNo=1`;
                    const response = await fetch(apiUrl);
                    if (response.ok) {
                        const textData = await response.text();
                        if (!textData.includes("OpenAPI_ServiceResponse") && !textData.includes("errMsg")) {
                            const parser = new DOMParser();
                            const xmlDoc = parser.parseFromString(textData, "text/xml");
                            const resultCode = xmlDoc.getElementsByTagName("resultCode")[0]?.textContent;
                            
                            if (resultCode === "00") {
                                const items = xmlDoc.getElementsByTagName("item");
                                if (items.length > 0) {
                                    let matchedItem = null;
                                    for (let item of items) {
                                        const itemCas = item.getElementsByTagName("casNo")[0]?.textContent || "";
                                        const itemKor = item.getElementsByTagName("chemNameKor")[0]?.textContent || "";
                                        
                                        if (isCasNumber && itemCas.includes(rawQuery)) {
                                            matchedItem = item;
                                            break;
                                        } else if (!isCasNumber && itemKor.includes(rawQuery)) {
                                            matchedItem = item;
                                            break;
                                        }
                                    }
                                    if (!matchedItem && items.length > 0) matchedItem = items[0];

                                    if (matchedItem) {
                                        const chemNameKor = matchedItem.getElementsByTagName("chemNameKor")[0]?.textContent || rawQuery;
                                        const casNo = matchedItem.getElementsByTagName("casNo")[0]?.textContent || rawQuery;
                                        const enNo = matchedItem.getElementsByTagName("enNo")[0]?.textContent || "";

                                        foundData = {
                                            chemName: chemNameKor,
                                            engName: enNo || "Standard Chemical",
                                            casNo: casNo,
                                            unNo: "참조",
                                            signalWord: rawQuery.includes("염산") || rawQuery.includes("수산화") ? "위험 (Danger)" : "경고 (Warning)",
                                            hazardClass: rawQuery.includes("염산") || casNo === "7647-01-0" ? "금속부식성 물질, 피부 부식성" : "인화성 액체 및 유해성 분류",
                                            hazardStatements: "H225: 고인화성 액체 및 증기\nH319: 눈에 심한 자극을 일으킴",
                                            precautionaryStatements: "P210: 열·스파크·화염으로부터 멀리하시오\nP280: 보호장갑·보안경 착용",
                                            firstAid: { inhalation: "신선한 공기로 이동", skin: "물로 세척", eyes: "흐르는 물로 씻기", ingestion: "의사 진찰 받기" },
                                            fireFighting: "적절한 소화기 사용",
                                            storage: "지정된 장소에 보관"
                                        };
                                    }
                                }
                            }
                        }
                    }
                } catch(err) {
                    console.warn("API 호출 실패, 내장 DB 탐색으로 전환합니다.", err);
                }
            }

            // 2. API 결과가 없거나 실패 시 내장 데이터베이스에서 정밀 탐색
            if (!foundData) {
                const lowerQ = rawQuery.toLowerCase();
                foundData = mockChemicalDatabase.find(item => 
                    item.casNo.toLowerCase() === lowerQ ||
                    item.chemName.toLowerCase().includes(lowerQ) ||
                    item.engName.toLowerCase().includes(lowerQ)
                );
            }

            setTimeout(() => {
                if(!foundData) {
                    container.innerHTML = `
                        <div class="bg-white p-12 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-500">
                            <i class="fa-solid fa-triangle-exclamation text-3xl text-amber-500 mb-3"></i>
                            <p class="text-sm font-semibold text-slate-700">검색 결과가 없습니다.</p>
                            <p class="text-xs text-slate-400 mt-1">입력하신 '${rawQuery}'에 해당하는 물질을 찾지 못했습니다. 올바른 CAS 번호(예: 67-64-1)나 물질명을 입력해주세요.</p>
                        </div>
                    `;
                    return;
                }

                const combinedText = (foundData.chemName + " " + foundData.hazardClass);
                const ghsHtml = getGhsSymbols(combinedText);

                // 라벨 프린터 최적화 디자인 카드
                container.innerHTML = `
                    <div id="printable-area" class="bg-white rounded-xl shadow-sm border-2 border-slate-800 overflow-hidden max-w-xl mx-auto w-full">
                        <!-- 헤더 -->
                        <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                            <div>
                                <span class="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded font-mono font-bold">CAS No. ${foundData.casNo}</span>
                                <h2 class="text-xl font-bold mt-1">${foundData.chemName}</h2>
                                <p class="text-xs text-slate-300 italic">${foundData.engName}</p>
                            </div>
                            <div class="no-print">
                                <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded-lg font-bold transition flex items-center gap-1.5 shadow">
                                    <i class="fa-solid fa-print"></i> SLP-DL410 인쇄
                                </button>
                            </div>
                        </div>

                        <!-- 바디 -->
                        <div class="p-4 grid grid-cols-2 gap-4 text-xs">
                            <div class="space-y-3">
                                <div class="border p-2 rounded bg-slate-50">
                                    <span class="font-bold text-slate-500 block text-[10px]">GHS 그림문자</span>
                                    <div class="flex items-center justify-start py-1">
                                        ${ghsHtml}
                                    </div>
                                </div>
                                <div class="border p-2 rounded bg-slate-50">
                                    <span class="font-bold text-slate-500 block text-[10px]">신호어 (Signal Word)</span>
                                    <p class="font-bold text-rose-600 text-sm mt-0.5">${foundData.signalWord}</p>
                                </div>
                            </div>
                            <div class="space-y-3">
                                <div class="border p-2 rounded bg-rose-50/50">
                                    <span class="font-bold text-rose-700 block text-[10px]">유해위험문구 (H)</span>
                                    <p class="font-mono text-[11px] mt-0.5 whitespace-pre-line">${foundData.hazardStatements}</p>
                                </div>
                                <div class="border p-2 rounded bg-amber-50/50">
                                    <span class="font-bold text-amber-700 block text-[10px]">예방조치문구 (P)</span>
                                    <p class="font-mono text-[11px] mt-0.5 whitespace-pre-line">${foundData.precautionaryStatements}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }, 300);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl text-xs shadow-lg z-50 flex items-center gap-2';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }
    </script>
</body>
</html>
